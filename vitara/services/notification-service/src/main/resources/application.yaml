
spring:
  application:
    name: notification-service

  mail:
    host: smtp.vitara.com
    port: 587
    username: ${MAIL_USERNAME:bookings@vitara.com}
    password: ${MAIL_APP_PASSWORD:vitarapassword12345}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

  # ── Kafka Consumer ──────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: "com.vitara.booking.event"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.zosh.event.BookingConfirmedEvent


  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}


notification:
  from-email: ${MAIL_FROM:booking@vitara.com}
  from-name: "Vitara Airline Notification"
  checkin-url: "your frontend url"

server:
  port: 9012


