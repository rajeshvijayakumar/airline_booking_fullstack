server:
  port: 9005

spring:
  application:
    name: user-service
  main:
    web-application-type: servlet
  datasource:
    url: jdbc:mysql://localhost:3306/vitara_user_db
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://USER-SERVICE # Must match spring.application.name in user-service
          predicates:
            - Path=/auth/**, /users/**
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
