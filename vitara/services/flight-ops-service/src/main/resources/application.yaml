
server:
  port: 9090

spring:
  application:
    name: flight-ops-service
  main:
    web-application-type: servlet
  datasource:
    url: jdbc:mysql://localhost:3306/vitara_flight_db
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always
  config:
    import: optional:configserver:http://localhost:8888



