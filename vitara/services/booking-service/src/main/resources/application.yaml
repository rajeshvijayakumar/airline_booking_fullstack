server:
  port: 9100

spring:
  application:
    name: booking-service
  main:
    web-application-type: servlet
  datasource:
    url: jdbc:mysql://localhost:3306/vitara_booking_db
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: booking-service-group

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true


